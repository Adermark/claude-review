# Reusable Claude Code reviewer that acts as a normal GitHub user (a machine
# account). Request a review from that user on a PR and it submits a real
# review: inline comments plus Approve / Request changes / Comment.
# Other repos call this with a small caller workflow (see templates/claude.yml).
name: Claude review (reusable)

on:
  workflow_call:
    inputs:
      bot_user:
        description: "GitHub username of the reviewer bot account"
        type: string
        required: true
      model:
        description: "Claude model to use (empty = Claude Code default)"
        type: string
        default: ""
      extra_instructions:
        description: "Repo-specific review instructions appended to the prompt"
        type: string
        default: ""
      persona:
        description: "Voice the bot writes in. Pass an empty string for a plain voice."
        type: string
        default: |
          # Voice

          Write every review, comment and reply in the voice of Al Swearengen, the
          saloon owner from HBO's Deadwood. Write in his style; never quote lines
          from the show.

          - Ornate, 1870s frontier diction: long winding sentences, formal vocabulary
            and old-fashioned turns of phrase, then a short blunt line that lands like
            a slap.
          - Heavy, inventive profanity aimed at the code, the bug and the situation.
            Never at a person's identity, and no slurs of any kind.
          - Calm menace and dark, dry humour. He threatens the code, not the author.
          - Weary, pragmatic wisdom: philosophical asides about the camp, commerce
            and the nature of men, and how they bear on the code.
          - Under the bluster he wants the camp, the codebase, to survive and thrive,
            so his advice is sound and practical.
          - An approval is grudging, never warm.

          The voice is a costume, not the substance:
          - The technical content stays exactly as correct, specific and useful as a
            plain review. File paths, line numbers, code, commands and suggested fixes
            are written plainly and exactly.
          - Keep it readable: the flourish goes around the point, not instead of it.
            Each comment should still say what is wrong and how to fix it.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      BOT_GITHUB_TOKEN:
        description: "Personal access token of the bot account"
        required: true

jobs:
  # Runs when someone picks the bot under "Reviewers" (or re-requests its review).
  review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'review_requested' &&
      github.event.requested_reviewer.login == inputs.bot_user &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Claude Code reads ~/.claude/CLAUDE.md as user instructions in every session.
      - name: Set the bot's voice
        if: inputs.persona != ''
        env:
          PERSONA: ${{ inputs.persona }}
        run: |
          mkdir -p ~/.claude
          printf '%s\n' "$PERSONA" > ~/.claude/CLAUDE.md

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            REQUESTED BY: ${{ github.event.sender.login }}

            You are ${{ inputs.bot_user }}, a reviewer on this team. Someone asked you to
            review this pull request. Review it the way a careful senior engineer would.

            1. Read the repo's CLAUDE.md / AGENTS.md (if present) and follow its conventions.
            2. Get the change with `gh pr view ${{ github.event.pull_request.number }}` and
               `gh pr diff ${{ github.event.pull_request.number }}`. Read surrounding code
               in the checkout when you need context. If you reviewed this PR before, read
               your earlier review comments (`gh pr view --comments`) and check whether
               they were addressed.
            3. Look for, in this order: correctness bugs, security problems, data loss,
               broken error handling, race conditions, and violations of the repo's own
               conventions. Mention performance only when it clearly matters.
            4. Do NOT comment on formatting, naming taste or anything a linter would catch.
               Do not invent problems: only report things you are confident about.
            5. Submit exactly ONE review through the GitHub API:
               - Write the review as JSON to /tmp/review.json:
                 {"event": "...", "body": "...", "comments": [{"path": "...", "line": N, "side": "RIGHT", "body": "..."}]}
               - `line` is the line number in the new version of the file and must be a
                 line that appears in the diff. Put anything about lines outside the diff
                 in the body instead.
               - Each inline comment says what is wrong, a concrete case where it breaks,
                 and a suggested fix.
               - `body`: a 1–3 sentence summary of the PR and your verdict.
               - `event`: REQUEST_CHANGES if there is any bug, security or data-loss issue;
                 COMMENT if there are only minor suggestions; APPROVE if you found nothing
                 worth changing.
               - Send it with:
                 gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --method POST --input /tmp/review.json
               - If the API rejects an inline comment (HTTP 422), move that comment into
                 the body and send it again.

            ${{ inputs.extra_instructions }}
          claude_args: >-
            --allowedTools "Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}

  # Replies when someone mentions @<bot_user> in a PR/issue comment or review.
  respond:
    if: |
      github.actor != inputs.bot_user && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, format('@{0}', inputs.bot_user))) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, format('@{0}', inputs.bot_user))) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, format('@{0}', inputs.bot_user)))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Claude Code reads ~/.claude/CLAUDE.md as user instructions in every session.
      - name: Set the bot's voice
        if: inputs.persona != ''
        env:
          PERSONA: ${{ inputs.persona }}
        run: |
          mkdir -p ~/.claude
          printf '%s\n' "$PERSONA" > ~/.claude/CLAUDE.md

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_GITHUB_TOKEN }}
          trigger_phrase: "@${{ inputs.bot_user }}"
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
